name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-start MCP server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Start the server, send nothing, then kill it. It must not crash and
          # must not print anything to stdout before receiving JSON-RPC input.
          out=$(timeout 2s node build/index.js < /dev/null > stdout.log 2> stderr.log || true)
          if [ -s stdout.log ]; then
            echo "FAIL: server wrote to stdout before any input:"
            cat stdout.log
            exit 1
          fi
          echo "OK: clean stdout"
